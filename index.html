<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SureBox | Панель Управления КП</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: rgba(22, 22, 29, 0.9);
            --bg-input: #121218;
            --accent: #2ed573;
            --accent-hover: #26af5d;
            --accent-glow: rgba(46, 213, 115, 0.35);
            --text-main: #f1f1f5;
            --text-muted: #8e8e9f;
            --border: rgba(46, 213, 115, 0.25);
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
        }

        [data-theme="pink"] {
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --accent-glow: rgba(255, 71, 87, 0.35);
            --border: rgba(255, 71, 87, 0.25);
        }
        [data-theme="blue"] {
            --accent: #1e90ff;
            --accent-hover: #3742fa;
            --accent-glow: rgba(30, 144, 255, 0.35);
            --border: rgba(30, 144, 255, 0.25);
        }
        [data-theme="purple"] {
            --accent: #8a2be2;
            --accent-hover: #9d4edd;
            --accent-glow: rgba(138, 43, 226, 0.35);
            --border: rgba(138, 43, 226, 0.25);
        }
        [data-theme="orange"] {
            --accent: #ffa502;
            --accent-hover: #ff7f00;
            --accent-glow: rgba(255, 165, 2, 0.35);
            --border: rgba(255, 165, 2, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 10%, var(--accent-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0,0,0,0.5) 0%, transparent 40%);
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease;
        }
        .toast.error { border-color: var(--danger); }
        .toast.error i { color: var(--danger); }
        .toast.success { border-color: var(--success); }
        .toast.success i { color: var(--success); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 30px var(--accent-glow);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .modal-close:hover { color: var(--danger); }

        .auth-container {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: 0 0 35px var(--accent-glow);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-card h1 { font-size: 28px; margin-bottom: 6px; }
        .auth-card h1 span { color: var(--accent); }
        .auth-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 11px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        header {
            background: rgba(10, 10, 12, 0.9);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .logo i { color: var(--accent); }

        .user-nav { display: flex; align-items: center; gap: 15px; }
        .user-badge { background: var(--bg-card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; font-size: 13px; }
        .user-badge .role { color: var(--accent); font-weight: 600; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            padding: 15px 30px 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .nav-tab {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 -4px 15px var(--accent-glow);
        }

        .container { padding: 30px; flex: 1; max-width: 1300px; width: 100%; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .card-title div { display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--accent); }

        .paste-zone {
            border: 2px dashed var(--border);
            background: var(--bg-input);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            outline: none;
        }

        .paste-zone.has-image { border-color: var(--success); color: var(--success); }
        .preview-img { max-width: 100%; max-height: 250px; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); display: none; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .stat-card { background: var(--bg-input); border: 1px solid var(--border); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--accent); margin: 8px 0; }

        .progress-bar { background: rgba(255, 255, 255, 0.05); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { background: var(--accent); height: 100%; width: 0%; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }

        .btn-sm { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #111; }
        .badge-x2 { background: rgba(46, 213, 115, 0.2); color: var(--success); padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }

        .input-group { display: flex; gap: 8px; }

        .role-select {
            padding: 4px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .mc-banner {
            background: linear-gradient(135deg, rgba(46,213,115,0.15), rgba(0,0,0,0.4));
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .staff-reports-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .staff-card-list { display: flex; flex-direction: column; gap: 10px; }
        .staff-user-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .staff-user-card:hover, .staff-user-card.active {
            border-color: var(--accent);
            background: rgba(46, 213, 115, 0.1);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .report-item-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .report-item-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .theme-switcher {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 999;
            backdrop-filter: blur(10px);
        }

            width
